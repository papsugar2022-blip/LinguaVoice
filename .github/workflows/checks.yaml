name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-console.txt
      - run: python -m unittest discover -s tests
      - run: node tests/test_upload_ui.js
      - run: python scripts/package_source.py source-check.zip
