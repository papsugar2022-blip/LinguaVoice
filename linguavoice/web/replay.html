<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>再听一遍</title>
<style>
:root{color-scheme:light dark;font:14px system-ui,sans-serif;color:light-dark(#173d3c,#e0f5ef)}
body{margin:0;padding:12px}main{display:flex;align-items:center;gap:14px;flex-wrap:wrap;border:1px solid light-dark(#d6e7e1,#39534d);border-radius:16px;padding:14px;background:light-dark(#f5fbf8,#142b27)}
.info{flex:1;min-width:120px}strong{display:block}p{margin:5px 0 0;font-size:12px;opacity:.8}
button{font:inherit;font-weight:600;border:0;border-radius:24px;background:#147e78;color:white;padding:12px 20px;cursor:pointer}button:disabled{opacity:.45;cursor:default}button:focus-visible{outline:3px solid #61cbb6;outline-offset:3px}
</style>
<main><div class="info"><strong id="voice">这段语音</strong><p id="status" role="status" aria-live="polite">正在连接播放器…</p></div><button id="replay" disabled>▶ 再听一遍</button></main>
<script>
'use strict';
const button=document.getElementById('replay'),status=document.getElementById('status'),voice=document.getElementById('voice');
let job=null,ready=false,busy=false,sequence=0;const pending=new Map();
const legacy=false;
function rpc(method,params){return new Promise((resolve,reject)=>{const id=++sequence;const replay=method==='tools/call';const timer=setTimeout(()=>{pending.delete(id);reject(new Error(replay?'暂未收到播放确认；如果已经听到，请勿重复点击。':'播放器连接超时，请稍后重新打开卡片。'));},replay?120000:15000);pending.set(id,{resolve,reject,timer});window.parent.postMessage({jsonrpc:'2.0',id,method,params},'*');});}
function update(result){const data=result?.structuredContent;if(!data?.id||!(/^[a-f0-9]{32}$/).test(data.id))return;
 if(job&&job.id!==data.id)return;job=data;voice.textContent=data.voice_name||'这段语音';
 status.textContent=data.status==='ready'?'重播这段录音，无需重新生成':'这段语音尚未准备好';button.disabled=!ready||busy||data.status!=='ready';}
window.addEventListener('message',event=>{if(event.source!==window.parent)return;const msg=event.data;if(!msg||msg.jsonrpc!=='2.0')return;
 if(pending.has(msg.id)){const item=pending.get(msg.id);pending.delete(msg.id);clearTimeout(item.timer);msg.error?item.reject(new Error(msg.error.message||'连接失败')):item.resolve(msg.result);return;}
 if(msg.method==='ui/notifications/tool-result')update(msg.params);
});
window.addEventListener('openai:set_globals',event=>{if(legacy)update({structuredContent:event.detail?.globals?.toolOutput||window.openai.toolOutput});});
button.onclick=async()=>{if(!ready||busy||job?.status!=='ready')return;busy=true;button.disabled=true;status.textContent='正在请求重播…';
 const slowNotice=setTimeout(()=>{status.textContent='请求已发出，正在等待确认；已听到时请勿重复点击。';},15000);
 try{const result=legacy?await window.openai.callTool('linguavoice_replay',{job_id:job.id}):await rpc('tools/call',{name:'linguavoice_replay',arguments:{job_id:job.id}});
 if(result?.isError)throw new Error(result.content?.find(c=>c.type==='text')?.text||'无法重播，请确认本机播放器已开启。');
 if(!result?.structuredContent?.queued)throw new Error('未收到重播确认，请稍后重试。');
 status.textContent='已请求在电脑上重播';
 }catch(error){status.textContent=error.message;}finally{clearTimeout(slowNotice);busy=false;button.disabled=!ready||job?.status!=='ready';}};
if(legacy){ready=true;update({structuredContent:window.openai.toolOutput});}
else rpc('ui/initialize',{appInfo:{name:'LinguaVoice Replay',version:'0.3.4'},appCapabilities:{},protocolVersion:'2026-01-26'}).then(()=>{
 ready=true;window.parent.postMessage({jsonrpc:'2.0',method:'ui/notifications/initialized',params:{}},'*');
 if(job)update({structuredContent:job});else status.textContent='等待这段语音…';
}).catch(()=>{status.textContent='当前客户端未连接播放卡片，可在声音设置中重播。';});
</script></html>
